<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Fatbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            max-height: 100vh;
            max-height: 100dvh;
            overflow-y: auto;
        }
        
        .btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            text-decoration: none;
            margin: 8px 0;
            min-width: 280px;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn:active {
            transform: scale(0.96);
        }
        
        .hidden {
            display: none !important;
        }
        
        #loading-screen, #fatbox-screen, #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        
        /* ========== ЗАГРУЗКА ========== */
        .loader-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 25px;
        }
        
        .loader-ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        
        .loader-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            border-top-color: #ffffff;
            animation: spin 1.1s linear infinite;
        }
        
        .loader-ring:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-right-color: #bbbbbb;
            animation: spin 1.6s linear infinite reverse;
        }
        
        .loader-ring:nth-child(3) {
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            border-bottom-color: #777777;
            animation: spin 0.9s linear infinite;
        }
        
        .loader-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .progress-container {
            width: 240px;
            height: 6px;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0 8px 0;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fff, #999, #fff);
            background-size: 200% 100%;
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        
        .loading-text {
            font-size: 16px;
            color: #999;
            letter-spacing: 4px;
            margin-top: 6px;
        }
        
        /* ========== FATBOX ========== */
        #fatbox-screen {
            position: relative;
            min-height: 200px;
        }
        
        .fatbox-text {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: scale(0.2);
            filter: blur(15px);
            transition: none;
        }
        
        /* Класс, который добавляется через JS — гарантирует появление */
        .fatbox-text.show {
            animation: fatboxIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fatboxIn {
            0% {
                opacity: 0;
                transform: scale(0.2);
                filter: blur(15px);
                letter-spacing: 30px;
            }
            40% {
                opacity: 1;
                filter: blur(0);
            }
            70% {
                transform: scale(1.12);
                letter-spacing: 8px;
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
                letter-spacing: 12px;
                text-shadow: 
                    0 0 8px #fff,
                    0 0 25px #fff,
                    0 0 50px rgba(255,255,255,0.7),
                    0 0 90px rgba(255,255,255,0.4);
            }
        }
        
        /* Постоянное пульсирующее свечение */
        .fatbox-text.show {
            animation: fatboxIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                       glowPulse 2.5s ease-in-out 1.4s infinite alternate;
        }
        
        @keyframes glowPulse {
            from {
                text-shadow: 
                    0 0 8px #fff,
                    0 0 25px #fff,
                    0 0 50px rgba(255,255,255,0.6);
            }
            to {
                text-shadow: 
                    0 0 15px #fff,
                    0 0 40px #fff,
                    0 0 80px rgba(255,255,255,0.9),
                    0 0 120px rgba(255,255,255,0.5);
            }
        }
        
        /* Подпись под Fatbox */
        .fatbox-sub {
            margin-top: 25px;
            font-size: 14px;
            color: #555;
            letter-spacing: 6px;
            opacity: 0;
            transition: opacity 1s ease 1.2s;
        }
        
        .fatbox-sub.show {
            opacity: 1;
        }
        
        .menu-title {
            font-size: 26px;
            margin-bottom: 16px;
            font-weight: bold;
            letter-spacing: 3px;
        }
        
        .section-title {
            font-size: 14px;
            color: #777;
            margin: 18px 0 6px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* Цвета кнопок */
        .roblox-btn { background: linear-gradient(135deg, #e2231a, #c41e16); color: white; }
        .brawl-btn { background: linear-gradient(135deg, #ffcc00, #ff9900); color: #000; }
        .discord-btn { background: linear-gradient(135deg, #5865F2, #4752C4); color: white; }
        .whatsapp-btn { background: linear-gradient(135deg, #25D366, #128C7E); color: white; }
        .grok-btn { background: linear-gradient(135deg, #1DA1F2, #0d8bd9); color: white; }
        .minecraft-btn { background: linear-gradient(135deg, #5B8C3E, #3D5C29); color: white; }
        .pubg-btn { background: linear-gradient(135deg, #F2A900, #c78a00); color: #000; }
        .freefire-btn { background: linear-gradient(135deg, #FF6B00, #cc5500); color: white; }
        .cod-btn { background: linear-gradient(135deg, #1a1a1a, #333); color: #00ff88; border: 1px solid #00ff88; }
        .mlbb-btn { background: linear-gradient(135deg, #00B4FF, #0077aa); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Старт -->
        <div id="start-screen">
            <button class="btn" onclick="startLoading()">Открыть</button>
        </div>
        
        <!-- Загрузка -->
        <div id="loading-screen" class="hidden">
            <div class="loader-wrapper">
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <div class="loader-center" id="percent">0%</div>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>
            <div class="loading-text">ЗАГРУЗКА</div>
        </div>
        
        <!-- Fatbox -->
        <div id="fatbox-screen" class="hidden">
            <div class="fatbox-text" id="fatbox-title">FATBOX</div>
            <div class="fatbox-sub" id="fatbox-sub">LOADING COMPLETE</div>
        </div>
        
        <!-- Меню -->
        <div id="menu-screen" class="hidden">
            <div class="menu-title">Выбери</div>
            
            <div class="section-title">Приложения</div>
            <button class="btn discord-btn" onclick="openDiscord()">Открыть Discord</button>
            <button class="btn whatsapp-btn" onclick="openWhatsApp()">Открыть WhatsApp</button>
            <button class="btn grok-btn" onclick="openGrok()">Открыть Grok</button>
            
            <div class="section-title">Игры</div>
            <button class="btn roblox-btn" onclick="openRoblox()">Открыть Roblox</button>
            <button class="btn brawl-btn" onclick="openBrawlStars()">Открыть Brawl Stars</button>
            <button class="btn minecraft-btn" onclick="openMinecraft()">Открыть Minecraft</button>
            <button class="btn pubg-btn" onclick="openPUBG()">Открыть PUBG Mobile</button>
            <button class="btn freefire-btn" onclick="openFreeFire()">Открыть Free Fire</button>
            <button class="btn cod-btn" onclick="openCOD()">Открыть Call of Duty</button>
            <button class="btn mlbb-btn" onclick="openMLBB()">Открыть Mobile Legends</button>
        </div>
    </div>

    <script>
        function startLoading() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');
            
            const percentEl = document.getElementById('percent');
            const progressEl = document.getElementById('progress');
            let percent = 0;
            
            const interval = setInterval(() => {
                percent += 1;
                if (percent > 100) {
                    clearInterval(interval);
                    return;
                }
                percentEl.textContent = percent + '%';
                progressEl.style.width = percent + '%';
            }, 45);
            
            // Через 5 секунд показываем Fatbox
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                const fatboxScreen = document.getElementById('fatbox-screen');
                fatboxScreen.classList.remove('hidden');
                
                // Важно: небольшая задержка + добавление класса, чтобы анимация точно запустилась
                setTimeout(() => {
                    document.getElementById('fatbox-title').classList.add('show');
                    document.getElementById('fatbox-sub').classList.add('show');
                }, 50);
                
                // Через 5 секунд → меню
                setTimeout(() => {
                    fatboxScreen.classList.add('hidden');
                    document.getElementById('menu-screen').classList.remove('hidden');
                }, 5000);
            }, 5000);
        }
        
        function openDiscord() { window.location.href = 'https://discord.com/app'; }
        function openWhatsApp() { window.location.href = 'https://web.whatsapp.com/'; }
        function openGrok() { window.location.href = 'https://grok.x.ai/'; }
        function openRoblox() { window.location.href = 'https://www.roblox.com/'; }
        function openBrawlStars() {
            window.location.href = 'brawlstars://';
            setTimeout(() => { window.location.href = 'https://supercell.com/en/games/brawlstars/'; }, 1500);
        }
        function openMinecraft() { window.location.href = 'https://www.minecraft.net/'; }
        function openPUBG() { window.location.href = 'https://www.pubgmobile.com/'; }
        function openFreeFire() { window.location.href = 'https://ff.garena.com/'; }
        function openCOD() { window.location.href = 'https://www.callofduty.com/mobile'; }
        function openMLBB() { window.location.href = 'https://m.mobilelegends.com/'; }
    </script>
</body>
</html>
